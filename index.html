<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>大学コード番号検索</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; }
        select { padding: 8px; font-size: 14px; min-width: 200px; }
        table { width: 60%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>大学コード番号検索</h2>

    <div class="controls">
        <label for="universitySelect">大学名を選択：</label>
        <select id="universitySelect">
            <option value="">-- データ読み込み中... --</option>
        </select>
    </div>

    <center>
    <table id="dataTable">
        <thead>
            <tr>
                <th width="100">大学名</th>
                <th width="100">学部 学科</th>
                <th width="50">日程</th>
                <th width="50">入試方式</th>
                <th width="100">大学コード</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </center>

    <script>
        let csvData = [];

        window.addEventListener('DOMContentLoaded', () => {
            // 元のCSVファイル（data.csv）を読み込み
            fetch('./data.csv')
                .then(response => {
                    if (!response.ok) throw new Error('CSV取得失敗');
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    // Shift_JIS / CP932 でデコード（文字化け防止）
                    const decoder = new TextDecoder('shift-jis');
                    const csvText = decoder.decode(buffer);
                    parseCSV(csvText);
                })
                .catch(error => {
                    console.error("エラー:", error);
                    alert('data.csv の読み込みに失敗しました。');
                });
        });

        // 先頭の「'」や余分なスペースを整形する関数
        function cleanVal(str) {
            if (!str) return '';
            let cleaned = str.trim();
            // 先頭のシングルクォーテーション「'」を除去
            if (cleaned.startsWith("'")) {
                cleaned = cleaned.substring(1);
            }
            // 前後の全角・半角スペースを除去
            return cleaned.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            csvData = [];
            const uniqueUniversities = [];
            const seenUniversities = new Set();

            // 1行目はヘッダーのため2行目からループ
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                const columns = lines[i].split(',');
                if (columns.length >= 11) {
                    // 各コード列（1〜5列目）を取得して整形
                    const uniCodePart   = cleanVal(columns[0]).padStart(4, '0'); // 大学ｺｰﾄﾞ (4桁)
                    const facCodePart   = cleanVal(columns[1]).padStart(2, '0'); // 学部ｺｰﾄﾞ (2桁)
                    const deptCodePart  = cleanVal(columns[2]).padStart(2, '0'); // 学科ｺｰﾄﾞ (2桁)
                    const schedCodePart = cleanVal(columns[3]).padStart(1, '0'); // 日程ｺｰﾄﾞ (1桁)
                    const methodCodePart= cleanVal(columns[4]).padStart(1, '0'); // 方式ｺｰﾄﾞ (1桁)

                    // 10桁の大学コードを生成
                    const fullCode = uniCodePart + facCodePart + deptCodePart + schedCodePart + methodCodePart;

                    // 各名称列（7〜11列目）を取得
                    const uniName  = cleanVal(columns[6]);  // 大学名
                    const facName  = cleanVal(columns[7]);  // 学部名
                    const deptName = cleanVal(columns[8]);  // 学科名
                    const sched    = cleanVal(columns[9]);  // 日程
                    const method   = cleanVal(columns[10]); // 入試方式

                    // 学部名と学科名を結合
                    const faculty = deptName ? `${facName} ${deptName}` : facName;

                    csvData.push({
                        uniName: uniName,
                        faculty: faculty,
                        schedule: sched,
                        method: method,
                        code: fullCode
                    });

                    if (uniName && !seenUniversities.has(uniName)) {
                        seenUniversities.add(uniName);
                        uniqueUniversities.push({ name: uniName, code: fullCode });
                    }
                }
            }

            // 大学コード順（昇順）に並び替え
            uniqueUniversities.sort((a, b) => {
                return a.code.localeCompare(b.code, undefined, { numeric: true, sensitivity: 'base' });
            });

            createDropdownOptions(uniqueUniversities);
        }

        function createDropdownOptions(uniList) {
            const select = document.getElementById('universitySelect');
            select.innerHTML = '<option value="">-- 大学を選択してください --</option>';
            
            uniList.forEach(uni => {
                const option = document.createElement('option');
                option.value = uni.name;
                option.textContent = uni.name; 
                select.appendChild(option);
            });
        }

        document.getElementById('universitySelect').addEventListener('change', function(e) {
            const selectedUni = e.target.value;
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';

            if (!selectedUni || csvData.length === 0) return;

            const filteredData = csvData.filter(row => row.uniName === selectedUni);

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(row.uniName)}</td>
                    <td>${escapeHtml(row.faculty)}</td>
                    <td>${escapeHtml(row.schedule)}</td>
                    <td>${escapeHtml(row.method)}</td>
                    <td>${escapeHtml(row.code)}</td>
                `;
                tbody.appendChild(tr);
            });
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[m]));
        }
    </script>
</body>
</html>
